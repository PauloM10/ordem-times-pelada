<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Times</title>
    <style>
        :root {
            --bg-color: #0b4d2c;
            --card-bg: #157345;
            --text-color: #ffffff;
            --btn-win: #28a745;
            --btn-draw: #ffc107;
            --btn-danger: #dc3545;
            --btn-action: #007bff;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1, h2, h3 { margin: 10px 0; text-align: center; }
        .config-section {
            background-color: var(--card-bg);
            padding: 15px;
            border-radius: 10px;
            width: 100%;
            max-width: 400px;
            margin-bottom: 20px;
            text-align: center;
        }
        select, button {
            padding: 10px;
            font-size: 16px;
            border-radius: 5px;
            border: none;
            margin: 5px;
            font-weight: bold;
        }
        .team-list { width: 100%; max-width: 400px; }
        .team-card {
            background-color: var(--card-bg);
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 18px;
        }
        .playing { border: 2px solid #fff; font-weight: bold; }
        .waiting { opacity: 0.8; }
        .controls button {
            padding: 5px 10px;
            margin: 0 2px;
            background-color: #fff;
            color: var(--bg-color);
            border-radius: 3px;
        }
        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            max-width: 400px;
            margin-top: 20px;
        }
        .btn-win { background-color: var(--btn-win); color: white; padding: 15px; }
        .btn-draw { background-color: var(--btn-draw); color: black; padding: 15px; }
        .btn-reset { background-color: var(--btn-danger); color: white; padding: 10px; margin-top: 30px; }

        /* Estilos do Modal de Confirmação */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background-color: white;
            color: black;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            width: 80%;
            max-width: 300px;
        }
        .modal-content p {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .modal-buttons {
            display: flex;
            justify-content: space-around;
        }
        .btn-sim { background-color: var(--btn-win); color: white; width: 45%; }
        .btn-nao { background-color: var(--btn-danger); color: white; width: 45%; }
    </style>
</head>
<body>

    <h1>⚽ Rasga Ponte</h1>

    <div class="config-section">
        <label for="qtdTimes">Quantidade de times hoje:</label>
        <select id="qtdTimes" onchange="alterarQtdTimes()">
            <option value="2">2 Times</option>
            <option value="3">3 Times</option>
            <option value="4">4 Times</option>
            <option value="5" selected>5 Times</option>
        </select>
    </div>

    <div id="jogando-agora" class="team-list">
        <h3>Em Campo</h3>
        <div id="campo-container"></div>
    </div>

    <div id="fila-espera" class="team-list">
        <h3>Fila de Espera</h3>
        <div id="fila-container"></div>
    </div>

    <div class="action-buttons">
        <button class="btn-win" id="btn-venceu-0" onclick="solicitarVitoria(0)">Vitória Time 1</button>
        <button class="btn-win" id="btn-venceu-1" onclick="solicitarVitoria(1)">Vitória Time 2</button>
        <button class="btn-draw" onclick="solicitarEmpate()">Deu Empate</button>
    </div>

    <button class="btn-reset" onclick="zerarTudo()">Zerar e Começar de Novo</button>

    <!-- Modal de Confirmação -->
    <div class="modal-overlay" id="modal">
        <div class="modal-content">
            <p id="modal-texto">Tem certeza?</p>
            <div class="modal-buttons">
                <button class="btn-nao" onclick="fecharModal()">Não</button>
                <button class="btn-sim" onclick="confirmarAcao()">Sim</button>
            </div>
        </div>
    </div>

    <script>
        const timesBase = ['Time A', 'Time B', 'Time C', 'Time D', 'Time E'];
        let times = JSON.parse(localStorage.getItem('timesPelada')) || [...timesBase];
        let numTimes = parseInt(localStorage.getItem('numTimesPelada')) || 5;
        let acaoPendente = null;

        document.getElementById('qtdTimes').value = numTimes;

        function salvar() {
            localStorage.setItem('timesPelada', JSON.stringify(times));
            localStorage.setItem('numTimesPelada', numTimes);
            renderizar();
        }

        function alterarQtdTimes() {
            numTimes = parseInt(document.getElementById('qtdTimes').value);
            salvar();
        }

        function moverTime(index, direcao) {
            if (direcao === 'cima' && index > 0) {
                let temp = times[index];
                times[index] = times[index - 1];
                times[index - 1] = temp;
            } else if (direcao === 'baixo' && index < numTimes - 1) {
                let temp = times[index];
                times[index] = times[index + 1];
                times[index + 1] = temp;
            }
            salvar();
        }

        // --- Lógica do Modal ---
        function abrirModal(texto, acao) {
            document.getElementById('modal-texto').innerText = texto;
            document.getElementById('modal').style.display = 'flex';
            acaoPendente = acao;
        }

        function fecharModal() {
            document.getElementById('modal').style.display = 'none';
            acaoPendente = null;
        }

        function confirmarAcao() {
            if (acaoPendente) acaoPendente();
            fecharModal();
        }
        // ------------------------

        function solicitarVitoria(indexVencedor) {
            let vencedor = times[indexVencedor];
            abrirModal(`O ${vencedor} venceu a partida. Tem certeza?`, () => {
                let indexPerdedor = indexVencedor === 0 ? 1 : 0;
                let perdedor = times[indexPerdedor];
                times.splice(indexPerdedor, 1);
                times.splice(numTimes - 1, 0, perdedor);
                salvar();
            });
        }

        function solicitarEmpate() {
            if (numTimes > 2) {
                abrirModal(`O jogo terminou empatado. Tem certeza?`, () => {
                    let time1 = times[0];
                    let time2 = times[1];
                    times.splice(0, 2);
                    times.splice(numTimes - 2, 0, time1, time2);
                    salvar();
                });
            } else {
                alert("Com apenas 2 times, o empate não altera a ordem.");
            }
        }

        function zerarTudo() {
            if (confirm("Zerar toda a ordem e voltar para o padrão A, B, C, D, E?")) {
                times = [...timesBase];
                salvar();
            }
        }

        function renderizar() {
            const campo = document.getElementById('campo-container');
            const fila = document.getElementById('fila-container');
            campo.innerHTML = '';
            fila.innerHTML = '';

            for (let i = 0; i < numTimes; i++) {
                let isCampo = i < 2;
                let btnHtml = `
                    <div class="controls">
                        <button onclick="moverTime(${i}, 'cima')">▲</button>
                        <button onclick="moverTime(${i}, 'baixo')">▼</button>
                    </div>
                `;

                let card = `<div class="team-card ${isCampo ? 'playing' : 'waiting'}">
                                <span>${i + 1}º - ${times[i]}</span>
                                ${btnHtml}
                            </div>`;

                if (isCampo) {
                    campo.innerHTML += card;
                } else {
                    fila.innerHTML += card;
                }
            }

            if (numTimes >= 2) {
                document.getElementById('btn-venceu-0').innerText = `Vitória ${times[0]}`;
                document.getElementById('btn-venceu-1').innerText = `Vitória ${times[1]}`;
            }
        }

        renderizar();
    </script>
</body>
</html>
