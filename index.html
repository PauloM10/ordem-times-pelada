<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gerenciador de Pelada</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #064e3b; /* Emerald 900 - Tema Futebol */
            color: #ecfdf5; /* Emerald 50 */
            -webkit-tap-highlight-color: transparent;
        }

        /* Efeito de clique nos botões */
        .btn-press:active {
            transform: scale(0.96);
        }

        /* Desabilitar setas visivelmente */
        .btn-disabled {
            opacity: 0.3;
            pointer-events: none;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen p-4 max-w-md mx-auto relative">

    <!-- Cabeçalho -->
    <header class="flex justify-between items-center py-4 mb-4 border-b border-emerald-700/50">
        <div class="flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7 text-emerald-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <path d="M8 12l2 2 4-4"></path>
            </svg>
            <h1 class="text-2xl font-black text-white tracking-tight uppercase italic">Rasga Ponte</h1>
        </div>
        <button id="btnReset" onclick="openModal()" class="hidden p-2 text-emerald-200 hover:text-white rounded-full bg-emerald-800 transition shadow-md">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                <path d="M3 3v5h5"></path>
            </svg>
        </button>
    </header>

    <!-- Tela de Configuração (Setup) -->
    <div id="setupScreen" class="flex flex-col flex-1 justify-center items-center gap-8 hidden">
        <div class="text-center">
            <h2 class="text-3xl font-black text-white mb-2">Preparar Jogo</h2>
            <p class="text-emerald-300">Quantos times vão jogar hoje?</p>
        </div>
        
        <div class="flex gap-3">
            <button onclick="selectTeamCount(2)" id="btnCount2" class="btn-press w-14 h-14 rounded-2xl text-2xl font-bold transition-colors">2</button>
            <button onclick="selectTeamCount(3)" id="btnCount3" class="btn-press w-14 h-14 rounded-2xl text-2xl font-bold transition-colors">3</button>
            <button onclick="selectTeamCount(4)" id="btnCount4" class="btn-press w-14 h-14 rounded-2xl text-2xl font-bold transition-colors">4</button>
            <button onclick="selectTeamCount(5)" id="btnCount5" class="btn-press w-14 h-14 rounded-2xl text-2xl font-bold transition-colors">5</button>
        </div>

        <button onclick="startGame()" class="btn-press mt-4 w-full max-w-xs py-4 bg-emerald-500 hover:bg-emerald-400 text-white font-black text-xl rounded-2xl shadow-lg border border-emerald-400 transition">
            Começar Pelada
        </button>
    </div>

    <!-- Tela Principal do Jogo -->
    <div id="playingScreen" class="flex flex-col flex-1 hidden">
        
        <!-- Lista Única de Times -->
        <div class="flex-1">
            <h2 class="text-xs uppercase tracking-widest text-emerald-300 mb-3 font-bold px-2">Ordem dos Times</h2>
            <ul id="teamList" class="flex flex-col gap-3 pb-4">
                <!-- Renderizado via JS -->
            </ul>
        </div>

        <!-- Controles da Partida (Movidos para baixo) -->
        <div class="bg-emerald-950/90 p-4 rounded-3xl shadow-2xl border border-emerald-800 mt-2 sticky bottom-4 backdrop-blur-sm z-10">
            <h2 class="text-[10px] uppercase tracking-widest text-emerald-400 mb-2 text-center font-bold">Lançar Resultado</h2>
            
            <div class="flex gap-2">
                <!-- Vitória 1º Time -->
                <button onclick="handleWin(0)" class="btn-press flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 px-1 rounded-xl transition shadow-md flex flex-col items-center justify-center border border-emerald-500/50">
                    <span class="text-[9px] text-emerald-200 uppercase mb-1 font-semibold tracking-wider">Venceu</span>
                    <span id="btnLabel1" class="text-sm truncate w-full text-center">1º Time</span>
                </button>
                
                <!-- Empate -->
                <button onclick="handleDraw()" class="btn-press flex-1 bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 px-1 rounded-xl transition shadow-md flex flex-col items-center justify-center border border-slate-600">
                    <span class="text-[9px] text-slate-300 uppercase mb-1 font-semibold tracking-wider">Saem os 2</span>
                    <span class="text-sm">Empate</span>
                </button>

                <!-- Vitória 2º Time -->
                <button onclick="handleWin(1)" class="btn-press flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 px-1 rounded-xl transition shadow-md flex flex-col items-center justify-center border border-emerald-500/50">
                    <span class="text-[9px] text-emerald-200 uppercase mb-1 font-semibold tracking-wider">Venceu</span>
                    <span id="btnLabel2" class="text-sm truncate w-full text-center">2º Time</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Modal de Confirmação de Reset -->
    <div id="resetModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-emerald-900 p-6 rounded-3xl max-w-sm w-full border border-emerald-700 text-center shadow-2xl">
            <h3 class="text-xl font-black mb-2 text-white uppercase italic">Reiniciar Pelada?</h3>
            <p class="text-emerald-200 text-sm mb-8">Isso encerrará o jogo atual e voltará para a tela de escolha de times.</p>
            <div class="flex gap-3">
                <button onclick="closeModal()" class="flex-1 py-3 rounded-xl bg-emerald-800 text-white font-semibold">Cancelar</button>
                <button onclick="resetApp()" class="flex-1 py-3 rounded-xl bg-red-600 hover:bg-red-500 text-white font-bold shadow-lg">Sim, Reiniciar</button>
            </div>
        </div>
    </div>

    <script>
        // --- Estado da Aplicação ---
        const ALPHABET = ['A', 'B', 'C', 'D', 'E'];
        
        let appState = JSON.parse(localStorage.getItem('peladaAppState')) || {
            mode: 'setup', // 'setup' | 'playing'
            teamCount: 5,
            teams: []
        };

        // Migração de estado antigo caso exista
        if (localStorage.getItem('peladaTeamsList') && !localStorage.getItem('peladaAppState')) {
            appState.teams = JSON.parse(localStorage.getItem('peladaTeamsList'));
            appState.teamCount = appState.teams.length;
            appState.mode = 'playing';
            localStorage.removeItem('peladaTeamsList');
        }

        // --- Lógica Principal ---
        
        function saveAndRender() {
            localStorage.setItem('peladaAppState', JSON.stringify(appState));
            render();
        }

        function selectTeamCount(count) {
            appState.teamCount = count;
            render();
        }

        function startGame() {
            appState.teams = ALPHABET.slice(0, appState.teamCount);
            appState.mode = 'playing';
            saveAndRender();
        }

        // Move um time para cima ou para baixo na lista
        function moveTeam(index, direction) {
            if (direction === -1 && index > 0) {
                [appState.teams[index - 1], appState.teams[index]] = [appState.teams[index], appState.teams[index - 1]];
            } else if (direction === 1 && index < appState.teams.length - 1) {
                [appState.teams[index + 1], appState.teams[index]] = [appState.teams[index], appState.teams[index + 1]];
            }
            saveAndRender();
        }

        function handleWin(winnerIndex) {
            if (appState.teams.length < 2) return;
            const loserIndex = winnerIndex === 0 ? 1 : 0;
            const winner = appState.teams[winnerIndex];
            const loser = appState.teams[loserIndex];
            const queue = appState.teams.slice(2);
            
            appState.teams = [winner, ...queue, loser];
            saveAndRender();
        }

        function handleDraw() {
            if (appState.teams.length < 2) return;
            const playing = appState.teams.slice(0, 2);
            const queue = appState.teams.slice(2);
            
            appState.teams = [...queue, ...playing];
            saveAndRender();
        }

        function resetApp() {
            appState.mode = 'setup';
            appState.teams = [];
            closeModal();
            saveAndRender();
        }

        // --- Controle de Interface (DOM) ---

        const setupScreenEl = document.getElementById('setupScreen');
        const playingScreenEl = document.getElementById('playingScreen');
        const btnResetEl = document.getElementById('btnReset');
        const teamListEl = document.getElementById('teamList');
        const btnLabel1 = document.getElementById('btnLabel1');
        const btnLabel2 = document.getElementById('btnLabel2');

        function render() {
            // Renderiza Tela de Setup
            if (appState.mode === 'setup') {
                setupScreenEl.classList.remove('hidden');
                playingScreenEl.classList.add('hidden');
                btnResetEl.classList.add('hidden');

                // Atualiza estilo dos botões de quantidade
                [2, 3, 4, 5].forEach(num => {
                    const btn = document.getElementById(`btnCount${num}`);
                    if (appState.teamCount === num) {
                        btn.className = "btn-press w-14 h-14 rounded-2xl text-2xl font-bold bg-emerald-500 text-white border-2 border-emerald-400 transition-colors shadow-lg";
                    } else {
                        btn.className = "btn-press w-14 h-14 rounded-2xl text-2xl font-bold bg-emerald-950 text-emerald-300 border border-emerald-800 transition-colors opacity-80";
                    }
                });
            } 
            // Renderiza Tela de Jogo
            else {
                setupScreenEl.classList.add('hidden');
                playingScreenEl.classList.remove('hidden');
                btnResetEl.classList.remove('hidden');

                if (appState.teams.length >= 2) {
                    btnLabel1.innerText = `Time ${appState.teams[0]}`;
                    btnLabel2.innerText = `Time ${appState.teams[1]}`;
                }

                teamListEl.innerHTML = '';

                appState.teams.forEach((team, index) => {
                    const isPlaying = index < 2;
                    const li = document.createElement('li');
                    
                    if (isPlaying) {
                        li.className = "bg-emerald-500/20 border-2 border-emerald-500 p-3 rounded-2xl flex items-center justify-between shadow-md";
                    } else {
                        li.className = "bg-emerald-900/50 border border-emerald-800 p-3 rounded-2xl flex items-center justify-between shadow-sm opacity-90";
                    }

                    const upDisabled = index === 0 ? 'btn-disabled' : '';
                    const downDisabled = index === appState.teams.length - 1 ? 'btn-disabled' : '';

                    const statusText = isPlaying 
                        ? `<span class="text-[10px] uppercase font-bold tracking-wider text-emerald-400 block -mb-1">Em Campo</span>`
                        : `<span class="text-[10px] uppercase font-bold tracking-wider text-emerald-600 block -mb-1">Fila - ${index + 1}º</span>`;

                    li.innerHTML = `
                        <div class="flex items-center gap-4">
                            <div class="w-12 h-12 flex items-center justify-center rounded-xl font-black text-2xl ${isPlaying ? 'bg-emerald-500 text-white shadow-lg' : 'bg-emerald-950 text-emerald-200'}">
                                ${team}
                            </div>
                            <div class="flex flex-col">
                                ${statusText}
                                <span class="font-bold text-lg text-white">Time ${team}</span>
                            </div>
                        </div>
                        <div class="flex flex-col gap-1 bg-emerald-950 p-1 rounded-lg border border-emerald-800/50">
                            <button onclick="moveTeam(${index}, -1)" class="p-2 rounded bg-emerald-900 text-emerald-300 hover:text-white hover:bg-emerald-700 transition ${upDisabled}">
                                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M5 15l7-7 7 7" />
                                </svg>
                            </button>
                            <button onclick="moveTeam(${index}, 1)" class="p-2 rounded bg-emerald-900 text-emerald-300 hover:text-white hover:bg-emerald-700 transition ${downDisabled}">
                                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
                                </svg>
                            </button>
                        </div>
                    `;
                    teamListEl.appendChild(li);
                });
            }
        }

        // Modais
        function openModal() { document.getElementById('resetModal').classList.remove('hidden'); }
        function closeModal() { document.getElementById('resetModal').classList.add('hidden'); }

        // Inicializa
        render();

    </script>
</body>
</html>
